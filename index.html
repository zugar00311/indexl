<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#000;--fg:#fff;--muted:rgba(255,255,255,0.65)}
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:Orbitron,system-ui,Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
    }
    .card{
      text-align:center;
      max-width:880px;
      width:100%;
      border-radius:12px;
      padding:3.5rem 2rem;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
    }
    h1{
      margin:0 0 .25rem 0;
      font-size:7.5rem;
      line-height:0.9;
      letter-spacing: -6px;
    }
    .sub{font-size:1rem;color:var(--muted);margin-bottom:1.5rem}
    .by{
      margin-top:1.5rem;
      display:flex;
      gap:2rem;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
    }
    .hack-by{font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:var(--fg)}
    .handles{
      display:flex;
      gap:1rem;
      align-items:center;
      justify-content:center;
      flex-direction:column;
    }
    .handle{
      padding:.5rem .9rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      color:var(--fg);
      text-decoration:none;
      font-weight:600;
      font-size:.95rem;
      display:flex;
      align-items:center;
      gap:.5rem;
    }
    .muted-text{color:var(--muted);font-size:.9rem;margin-top:1rem}
    .ig-logo{
      width:20px;
      height:20px;
      display:inline-block;
      background-image:url('https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png');
      background-size:cover;
    }

    @media (max-width:520px){
      h1{font-size:4rem}
      .card{padding:2rem}
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>404</h1>
    <div class="sub">Not Found</div>

    <div class="hack-by">HACKED BY</div>

    <div class="by">
      <div class="handles">
        <a class="handle" href="https://instagram.com/sugar0031" target="_blank" rel="noopener noreferrer">
          <span class="ig-logo"></span>Sugar0031
        </a>
        <a class="handle" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
          <span class="ig-logo"></span>Lawrex
        </a>
      </div>
    </div>

    <div class="muted-text">This page intentionally displays a 404 — nothing to see here.</div>
  </div>
</body>
</html>
